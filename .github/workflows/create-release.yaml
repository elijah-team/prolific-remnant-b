name: Create release on tag-push

on:
  push:
    tags:
      - 'r/*'

jobs:
  release:
    # Not sure iof this should be in it's own file
    # It could also push a new branch with version like create issue thing
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
