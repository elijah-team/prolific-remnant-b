name: mvn package with temurin-17

on:
  workflow_dispatch:
#  push:
    branches: [ "pr-mainline-k" ]
  pull_request:
#    branches: [ "pr-mainline-k",  "pr-fluffy-cegont" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
